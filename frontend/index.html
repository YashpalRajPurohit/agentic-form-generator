<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Form Generator ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f9fafb; 
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Navigation / Auth Bar */
        .navbar {
            width: 100%;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-weight: 700; font-size: 1.1rem; }
        .auth-status { display: flex; align-items: center; gap: 12px; }
        .badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.85rem; font-weight: 500; }
        .badge-success { background-color: #d1fae5; color: #065f46; }
        .badge-error { background-color: #fee2e2; color: #991b1b; }
        
        .btn-auth {
            padding: 8px 16px; border-radius: 6px; font-weight: 600; 
            cursor: pointer; text-decoration: none; font-size: 0.9rem; 
            border: none; transition: background-color 0.2s;
        }
        .btn-login { background-color: #2563eb; color: white; }
        .btn-login:hover { background-color: #1d4ed8; }
        .btn-logout { background-color: #ef4444; color: white; }
        .btn-logout:hover { background-color: #dc2626; }

        /* Main Container */
        .container {
            max-width: 650px;
            width: 100%;
            margin-top: 40px;
            padding: 0 20px;
        }

        h2 { font-size: 2rem; margin-bottom: 8px; }
        p.subtitle { color: #6b7280; margin-bottom: 24px; font-size: 1.1rem; }

        .input-group { display: flex; gap: 8px; }
        
        input[type="text"] {
            flex: 1; padding: 12px 16px; border: 1px solid #d1d5db; 
            border-radius: 8px; font-size: 1rem; outline: none;
        }
        input[type="text"]:focus {
            border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button.btn-build {
            padding: 12px 24px; background-color: #10b981; color: white; 
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; 
            cursor: pointer; transition: background-color 0.2s;
        }
        button.btn-build:hover { background-color: #059669; }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }

        /* Gemini-style status */
        #status-indicator { margin-top: 24px; font-style: italic; color: #666; height: 24px; }
        #result-box { margin-top: 20px; font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="brand">AgenticForms ⚡</div>
        <div class="auth-status" id="auth-container">
            <span id="auth-badge" class="badge">Checking session...</span>
            <a id="auth-btn" class="btn-auth" style="display: none;">Action</a>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="container">
        <h2>AI Form Generator ⚡️</h2>
        <p class="subtitle">Describe the form you want to build:</p>
        
        <div class="input-group">
            <input type="text" id="prompt" placeholder="E.g., Create a gym feedback survey..." disabled>
            <button id="submit-btn" class="btn-build" onclick="generateForm()" disabled>Build Form</button>
        </div>

        <!-- The single line that will change in place -->
        <div id="status-indicator"></div>
        
        <!-- The box for the final output -->
        <div id="result-box"></div>
    </div>

    <script>
        let currentThreadId = null;
        let isAuthenticated = false;

        // 1. Check Authentication Status on Page Load
        async function checkAuth() {
            const badge = document.getElementById("auth-badge");
            const btn = document.getElementById("auth-btn");
            const promptInput = document.getElementById("prompt");
            const buildBtn = document.getElementById("submit-btn");

            try {
                const response = await fetch('/auth/status');
                const data = await response.json();

                if (data.authenticated) {
                    isAuthenticated = true;
                    badge.innerText = "Connected to Google";
                    badge.className = "badge badge-success";
                    
                    btn.innerText = "Logout";
                    btn.className = "btn-auth btn-logout";
                    btn.href = "/auth/logout";
                    btn.style.display = "inline-block";

                    promptInput.disabled = false;
                    buildBtn.disabled = false;
                } else {
                    isAuthenticated = false;
                    badge.innerText = "Not Authenticated";
                    badge.className = "badge badge-error";

                    btn.innerText = "Login with Google";
                    btn.className = "btn-auth btn-login";
                    btn.href = "/auth/login";
                    btn.style.display = "inline-block";

                    promptInput.disabled = true;
                    promptInput.placeholder = "Please login with Google first to create forms...";
                    buildBtn.disabled = true;
                }
            } catch (err) {
                badge.innerText = "Auth Check Failed";
                badge.className = "badge badge-error";
            }
        }

        // 2. Generate Form via WebSocket
        function generateForm() {
            if (!isAuthenticated) {
                alert("Please login first!");
                return;
            }

            const promptInput = document.getElementById("prompt");
            const promptText = promptInput.value.trim();
            const statusIndicator = document.getElementById("status-indicator");
            const resultBox = document.getElementById("result-box");
            const submitBtn = document.getElementById("submit-btn");
            
            if (!promptText) return;
            
            // Lock the UI for a new run
            submitBtn.disabled = true;
            resultBox.innerHTML = ""; // Clear previous results
            statusIndicator.style.color = "#666";
            statusIndicator.innerText = "Dialing the AI agent...";
            
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws/generate-form`;
            const ws = new WebSocket(wsUrl);
                        
            ws.onopen = function() {
                ws.send(JSON.stringify({ 
                    prompt: promptText,
                    thread_id: currentThreadId 
                }));
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                // Capture the thread_id when the server returns it for continuous edits
                if (data.thread_id) {
                    currentThreadId = data.thread_id;
                    console.log("Session active! Thread ID:", currentThreadId);
                }

                // Robust parser for status text
                const statusText = data.message || data.text || data.node || data.step || data.details || data.status || (typeof data === 'string' ? data : JSON.stringify(data));
                
                if (data.status === "error" || data.error) {
                    statusIndicator.innerText = `❌ Error: ${data.error || statusText}`;
                    statusIndicator.style.color = "#dc2626";
                    submitBtn.disabled = false;
                    return;
                }

                if (data.status === "complete" || data.form_url || data.title) {
                    // Finished! Hide status, show results
                    statusIndicator.innerText = ""; 
                    
                    const title = data.title || "Form Ready";
                    const url = data.form_url || data.url || data.responder_uri;
                    
                    let resultHTML = `<span style='color: #059669;'><strong>✅ ${title}</strong></span>`;
                    if (url) {
                        resultHTML += `<br><a href="${url}" target="_blank" style="color: #2563eb; font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 8px;">Open Form in Google Drive ↗</a>`;
                    }
                    resultBox.innerHTML = resultHTML;
                    
                    // Clean up the input for the next edit
                    promptInput.value = "";
                    promptInput.placeholder = "Type your edits here (e.g., 'Make question 1 a dropdown')";
                    submitBtn.disabled = false;
                } else {
                    // Update the single in-place line for intermediate steps
                    statusIndicator.innerText = `✨ ${statusText}`;
                    statusIndicator.style.color = "#6b7280";
                }
            };
            
            ws.onerror = function(err) {
                statusIndicator.innerText = "❌ Connection error. Is Uvicorn running?";
                statusIndicator.style.color = "#dc2626";
                submitBtn.disabled = false;
            };

            ws.onclose = function() {
                submitBtn.disabled = false;
            };
        }

        // Run auth check when DOM loads
        window.onload = checkAuth;
    </script>
</body>
</html>
