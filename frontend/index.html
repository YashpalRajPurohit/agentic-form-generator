<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agentic Form Generator</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        input { width: 75%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* New styling for the Gemini-style status */
        #status-indicator { margin-top: 20px; font-style: italic; color: #666; height: 24px; }
        #result-box { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <h2>AI Form Generator ⚡️</h2>
    <p>Describe the form you want to build:</p>
    
    <div>
        <input type="text" id="prompt" placeholder="E.g., Create a gym feedback survey...">
        <button id="submit-btn" onclick="generateForm()">Build Form</button>
    </div>

    <!-- The single line that will change in place -->
    <div id="status-indicator"></div>
    
    <!-- The box for the final output -->
    <div id="result-box"></div>

    <script>
        // 1. Global variable to store the session ID
        let currentThreadId = null;

        function generateForm() {
            const promptInput = document.getElementById("prompt");
            const promptText = promptInput.value.trim();
            const statusIndicator = document.getElementById("status-indicator");
            const resultBox = document.getElementById("result-box");
            const submitBtn = document.getElementById("submit-btn");
            
            if (!promptText) return;
            
            // Lock the UI for a new run
            submitBtn.disabled = true;
            statusIndicator.style.color = "#666";
            statusIndicator.innerText = "Dialing the AI agent...";
            
            // const ws = new WebSocket("ws://localhost:8000/ws/generate-form"); # for local
            // Automatically detect protocol (wss: for https live, ws: for http local)
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";

            // Dynamically construct the WebSocket URL based on the host
            const wsUrl = `${protocol}//${window.location.host}/ws/generate-form`;

            // Connect to the WebSocket
            const ws = new WebSocket(wsUrl);
                        
            ws.onopen = function() {
                // 2. Send the thread_id along with the prompt
                ws.send(JSON.stringify({ 
                    prompt: promptText,
                    thread_id: currentThreadId 
                }));
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.error) {
                    statusIndicator.innerText = `❌ Error: ${data.error}`;
                    statusIndicator.style.color = "red";
                    submitBtn.disabled = false;
                    return;
                }

                // Overwrite the text instead of appending a list!
                if (data.status) {
                    statusIndicator.innerText = `✨ ${data.status}`;
                }
                
                // 3. Capture the thread_id when the server returns it
                if (data.thread_id) {
                    currentThreadId = data.thread_id;
                    console.log("Session active! Thread ID:", currentThreadId);
                }
                
                // 4. When finished, clear the status and show the final result
                if (data.title) {
                    statusIndicator.innerText = ""; // Hide the status
                    resultBox.innerHTML = `<span style='color: green;'><strong>✅ Form Ready: ${data.title}</strong></span>`;
                    
                    // Clean up the input for the next edit
                    promptInput.value = "";
                    promptInput.placeholder = "Type your edits here (e.g., 'Make question 1 a dropdown')";
                    submitBtn.disabled = false;
                }
            };
            
            ws.onerror = function(err) {
                statusIndicator.innerText = "❌ Connection error. Is Uvicorn running?";
                statusIndicator.style.color = "red";
                submitBtn.disabled = false;
            };

            ws.onclose = function() {
                submitBtn.disabled = false;
            };
        }
    </script>
</body>
</html>
